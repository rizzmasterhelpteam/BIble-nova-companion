<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta id="theme-color-meta" name="theme-color" content="#d9e9f7" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'sha256-o3vw7KF0LYKNNtUZ58Qzd+8ocOtmjWB0Ea1qS8Nrums=' 'sha256-pta9L383YDNHLzuJbaMg5YUk1Aznhej4FBbV8jv/12c=' 'wasm-unsafe-eval'; connect-src 'self' https://biblecompanion.vercel.app http://localhost:3000 http://localhost:5173 https://localhost capacitor://localhost https://*.supabase.co wss://*.supabase.co https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com https://accounts.google.com; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' https://accounts.google.com https://*.supabase.co; form-action 'self' https://accounts.google.com"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bible Nova" />
    <script>
      (() => {
        const root = document.documentElement;
        let storedTheme = null;
        try {
          storedTheme = window.localStorage.getItem("vite-ui-theme");
        } catch {
          storedTheme = null;
        }

        const systemTheme = window.matchMedia?.("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        const resolvedTheme = storedTheme === "dark" || storedTheme === "light"
          ? storedTheme
          : systemTheme;

        root.classList.toggle("dark", resolvedTheme === "dark");
        root.classList.toggle("light", resolvedTheme !== "dark");
        root.dataset.design = "nocturne";
        root.style.colorScheme = resolvedTheme;
        root.style.background = resolvedTheme === "dark" ? "#050b14" : "#d9e9f7";
        const themeColor = document.getElementById("theme-color-meta");
        if (themeColor) {
          themeColor.setAttribute("content", resolvedTheme === "dark" ? "#050b14" : "#d9e9f7");
        }
        window.__BIBLE_NOVA_THEME_BOOTSTRAPPED__ = true;
        root.dataset.startupStage = "theme-bootstrap-applied";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap"
    />
    <title>Bible Nova Companion</title>
    <style>
      :root {
        color-scheme: light;
        background: #d9e9f7;
      }

      :root.dark {
        color-scheme: dark;
        background: #050b14;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #d9e9f7;
        color: #22324b;
      }

      html.dark,
      html.dark body {
        background: #050b14;
        color: #ebf2ff;
      }

      #initial-app-shell {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 2rem;
        font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }

      #initial-app-shell.startup-fallback-visible {
        display: grid;
      }

      .startup-fallback-card {
        width: min(100%, 22rem);
        display: grid;
        justify-items: center;
        gap: 0.8rem;
        padding: 2rem 1.5rem;
        border: 1px solid rgba(111, 214, 255, 0.18);
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      }

      html.dark .startup-fallback-card {
        background: rgba(8, 14, 24, 0.94);
      }

      .startup-fallback-logo {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1.2rem;
        object-fit: cover;
        background: #fff;
      }

      .startup-fallback-card h1,
      .startup-fallback-card p {
        margin: 0;
      }

      .startup-fallback-card p {
        color: #96a7c6;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .startup-fallback-card button {
        min-height: 2.75rem;
        padding: 0.65rem 1.25rem;
        border: 0;
        border-radius: 999px;
        background: #b88732;
        color: #fffaf1;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .startup-fallback-id {
        font-size: 0.7rem !important;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="initial-app-shell" aria-live="polite" aria-busy="true">
        <div class="startup-fallback-card">
          <img class="startup-fallback-logo" src="/favicon.png" alt="Bible Nova Companion" />
          <h1>Bible Nova</h1>
          <p id="startup-fallback-message">Preparing your reflection space&hellip;</p>
          <button id="startup-retry" type="button" hidden onclick="window.location.reload()">Retry</button>
          <p id="startup-fallback-id" class="startup-fallback-id" hidden></p>
        </div>
      </main>
    </div>
    <script>
      (() => {
        const startup = window.__BIBLE_NOVA_STARTUP__ || {
          id: window.crypto?.randomUUID?.() || `startup-${Date.now()}`,
          startedAt: Date.now(),
          stage: "index-loaded",
          reactMounted: false,
        };
        window.__BIBLE_NOVA_STARTUP__ = startup;
        startup.stage = window.__BIBLE_NOVA_THEME_BOOTSTRAPPED__
          ? "theme-bootstrap-applied"
          : "index-loaded";
        document.documentElement.dataset.startupStage = startup.stage;

        window.setTimeout(() => {
          if (startup.reactMounted) return;
          startup.stage = "startup-failure";
          const fallback = document.getElementById("initial-app-shell");
          const message = document.getElementById("startup-fallback-message");
          const retry = document.getElementById("startup-retry");
          const diagnosticId = document.getElementById("startup-fallback-id");
          fallback?.classList.add("startup-fallback-visible");
          fallback?.removeAttribute("hidden");
          fallback?.setAttribute("aria-busy", "false");
          if (message) message.textContent = "Bible Nova could not start. Please retry.";
          if (retry) retry.removeAttribute("hidden");
          if (diagnosticId) {
            diagnosticId.textContent = `Diagnostic ID: ${startup.id}`;
            diagnosticId.removeAttribute("hidden");
          }
          document.documentElement.dataset.startupStage = startup.stage;
          const hideSplash = window.Capacitor?.Plugins?.SplashScreen?.hide;
          if (typeof hideSplash === "function") {
            void hideSplash().catch(() => undefined);
          }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
