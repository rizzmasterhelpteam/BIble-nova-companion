<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050b14" />
    <title>Bible Nova Companion</title>
    <style>
      :root { color-scheme: dark; background: #050b14; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0%, #173653 0%, #050b14 62%); color: #ebf2ff; font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; text-align: center; }
      main { width: min(100%, 360px); }
      img { width: 72px; height: 72px; margin-bottom: 20px; border-radius: 22px; }
      h1 { margin: 0 0 8px; font: 600 27px/1.15 Georgia, serif; }
      p { margin: 0; color: #96a7c6; }
      .status { margin-top: 18px; font-size: 13px; }
      button { min-height: 46px; margin-top: 24px; padding: 10px 24px; border: 0; border-radius: 999px; background: #1b9ed8; color: #f5fbff; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main id="startup" role="status" aria-live="polite">
      <img src="app-icon.png" alt="" />
      <h1 id="title">Opening your reflection space</h1>
      <p id="message">Connecting securely to Bible Nova Companion…</p>
      <p class="status" id="diagnostics">Native shell ready.</p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </main>
    <script>
      const startup = document.getElementById("startup");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const diagnostics = document.getElementById("diagnostics");

      if (navigator.onLine === false) {
        startup.setAttribute("role", "alert");
        title.textContent = "No internet connection";
        message.textContent = "Bible Nova needs an internet connection to open your reflection space.";
        diagnostics.textContent = "Reconnect, then tap Retry.";
      } else if (window.Capacitor) {
        diagnostics.textContent = "Secure native bridge ready.";
      }
    </script>
  </body>
</html>
