<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050b14" />
    <title>Bible Nova Companion unavailable</title>
    <style>
      :root { color-scheme: dark; background: #050b14; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #050b14; color: #ebf2ff; font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; text-align: center; }
      main { width: min(100%, 360px); padding: 28px 22px; border: 1px solid rgba(111, 214, 255, .18); border-radius: 24px; background: rgba(8, 14, 24, .92); }
      h1 { margin: 0 0 10px; font: 600 24px/1.2 Georgia, serif; }
      p { margin: 0; color: #96a7c6; }
      button { min-height: 44px; margin-top: 22px; padding: 10px 22px; border: 0; border-radius: 999px; background: #1b9ed8; color: #f5fbff; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main role="alert">
      <h1>Your reflection space is offline.</h1>
      <p>Reconnect to the internet and try again. Your account data has not been changed.</p>
      <button type="button" onclick="window.location.replace('https://biblecompanion.vercel.app/?nativeRetry=' + Date.now())">Retry</button>
    </main>
  </body>
</html>
